name: Build and Deploy Kiri Repositories

on:
  push:
    branches:
      - main
    paths:
      - '**/packages/*.hpkg'
      - '**/repo.info'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Haiku Host Tools (package_repo)
        run: |
          mkdir -p bin
          curl -sL https://raw.githubusercontent.com/haiku/haiku-toolchains-ubuntu/master/fetch.sh -o fetch.sh
          chmod +x fetch.sh
          
          # Lade die vorkompilierten Linux Host-Tools von Haiku herunter
          HOSTTOOLS_URL=$(./fetch.sh --hosttools)
          # the release is a zip now (it was a tar.xz), without a top level directory
          curl -sL "$HOSTTOOLS_URL" -o hosttools.zip
          unzip -q hosttools.zip -d bin/
          chmod +x bin/*
          
          # Füge den bin-Ordner zum PATH hinzu
          echo "$(pwd)/bin" >> $GITHUB_PATH
          # the tools load libroot_build.so and the like from the same directory
          echo "LD_LIBRARY_PATH=$(pwd)/bin:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build Index for x86_64
        run: |
          if [ -d "x86_64/packages" ] && [ -n "$(ls -A x86_64/packages/*.hpkg 2>/dev/null)" ]; then
            cd x86_64
            package_repo create repo.info packages/*.hpkg
            # pkgman add-repo checks the repository against this checksum
            sha256sum repo | cut -d' ' -f1 > repo.sha256
            cd ..
          fi

      - name: Generate Packages Directory Listing
        run: |
          python3 scripts/generate_directory_index.py

      - name: Ensure .nojekyll exists
        run: |
          touch .nojekyll

      # GitHub Pages serves the main branch, so the generated files are committed there (a push with the
      # workflow token does not start this workflow again)
      - name: Commit the generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x86_64/repo x86_64/repo.sha256 x86_64/packages/index.html .nojekyll
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update the repository index"
            git pull --rebase
            git push
          fi
