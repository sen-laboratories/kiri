name: Build the Kiri Repository Index

# The repository file is made with package_repo, a Haiku tool, so this runs it in a Haiku VM.
# GitHub Pages serves the main branch, the result is committed back to it.

on:
  push:
    branches:
      - main
    paths:
      - '**/packages/*.hpkg'
      - '**/repo.info'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Start Haiku VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: haiku
          architecture: x86-64
          version: 'r1beta6'

      - name: Build Index for x86_64
        shell: cpa.sh {0}
        run: |
          cd x86_64
          if ls packages/*.hpkg >/dev/null 2>&1; then
            package_repo create repo.info packages/*.hpkg
          fi

      - name: Generate Packages Directory Listing
        run: python3 scripts/generate_directory_index.py

      - name: Ensure .nojekyll exists
        run: touch .nojekyll

      - name: Commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x86_64/repo x86_64/packages/index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Update the package index"
            git push
          fi
